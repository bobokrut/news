name: CI

on:
  push:
    branches: [ master ]

  workflow_dispatch:

jobs:

  code-check:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: '3.10.4' 

      - name: installing poetry
        uses: abatilo/actions-poetry@v2.0.0
        with:
          poetry-version: '3.10.4'

      - name: installing packages
        run: |
          poetry install
          poetry shell

      - name: running mypy
        run: mypy *.py

      - name: running pytest
        run: pytest

  build:

    needs: code-check
    runs-on: self-hosted

    steps:

      - uses: actions/checkout@v3

      - name: deploying from master 
        run: |
          cd /home/pi/progs/news
          git pull origin master
          docker compose up -d --build
