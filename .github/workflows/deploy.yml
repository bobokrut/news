name: CI

on:
  push:
    branches: [ master ]

  workflow_dispatch:

jobs:

  code-check:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: '3.10.4' 

      - name: installing packages
        run: |
          pip install --upgrade pip poetry==1.1.13
          poetry install
          
      - name: running mypy
        run: poetry run mypy *.py

      - name: running pytest
        run: poetry run pytest

  build:

    needs: code-check
    runs-on: self-hosted

    steps:

      - uses: actions/checkout@v3

      - name: deploying from master 
        run: |
          cd /home/pi/progs/news
          git pull origin master
          docker compose up -d --build
