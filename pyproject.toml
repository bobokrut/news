ruff = "^0.0.278"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
target-version = ["py311"]

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "/home/bobokrut/.cache/pypoetry/virtualenvs"
venv = "news-VBAa4j2y-py3.11"
pythonVersion = "3.11"
useLibraryCodeForTypes = false

[tool.ruff]
select = ["E", "F", "T20"]
ignore = ["E402", "E501"]

