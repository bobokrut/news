[tool.poetry]
name = "news"
version = "0.1.0"
description = ""
authors = ["bobokrut <egor-evlampiev@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.31.0"
feedparser = "^6.0.10"
loguru = "^0.7.0"
pyyaml = "^6.0"
deepl = "^1.15.0"
openai = "^0.27.8"


[tool.poetry.group.dev.dependencies]
black = "^23.7.0"
